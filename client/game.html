<!DOCTYPE html>
<html lang="ja">

<head>
	<meta charset="UTF-8">
	<!--<link rel="icon" href="data:,">-->
	<link rel="icon" href="/assets/icon.ico" sizes="any">
	<title>TalesBeaver</title>
	<link rel="stylesheet" href="./css/game.css">
	<link rel="stylesheet" href="./css/resize.css">
	<link rel="stylesheet" href="./css/chat.css">
	<link rel="stylesheet" href="./css/rightMenu.css">
	<link rel="stylesheet" href="./css/leftStatus.css">
</head>

<body>

	<!--2Dキャンバス　DOMをcanvasに入れるとDOMは消える-->
	<canvas id="gameCanvas"></canvas>

	<!--デバッグ用-->
	<div id="debugInfo"></div>

	<!-- ロード画面 -->
	<div id="loading-screen">
		<div class="loading-content">
			<p id="loading-text">Loading... 0%</p>
			<div class="progress-bar-bg">
				<div id="progress-bar"></div>
			</div>
		</div>
	</div>

	<!-- チャットウィンドウ -->
	<div id="chatArea">

		<div id="chatTopBar"></div>

		<!-- チャット範囲選択 -->
		<div id="chatRange">
			<div id="chatRangeClub" class="chatRangeBtn"></div>
			<div id="chatRangeWhisper" class="chatRangeBtn"></div>
			<div id="chatRangeParty" class="chatRangeBtn"></div>
			<div id="chatRangeOpen" class="chatRangeBtn"></div>
		</div>

		<!-- ログエリア -->
		<div id="chatLogArea">
			<div id="chatLog"></div>
			<div id="chatScrollArea">
				<div id="chatScrollUp"></div>
				<div id="chatScrollTrack">
					<div id="chatScrollBar"></div>
				</div>
				<div id="chatScrollDown"></div>
			</div>
		</div>
			
		<!-- インプットエリア -->
		<div id="chatUnder">
			<div id="chatOpen" class="chatBtn"></div>
			<input type="test" id="chatWhisperUser">
			<input type="text" id="chatInput" placeholder="">
			<div id="chatMail" class="chatBtn"></div>
			<div id="chatMemo" class="chatBtn"></div>
			<div id="chatMessanger" class="chatBtn"></div>
			<div id="chatDM" class="chatBtn"></div>
			<div id="chatFixedText" class="chatBtn"></div>
			<div id="chatEmote" class="chatBtn"></div>
		</div>
	</div>

	<!-- 右メニュー -->
	<div id="rightMenu">
		<div id="rightMenuButtons" class="closed">
			<div id="rightMenuCharacter" class="rightMenuBtn"></div>
			<div id="rightMenuCombo" class="rightMenuBtn"></div>
			<div id="rightMenuEquip" class="rightMenuBtn"></div>
			<div id="rightMenuItem" class="rightMenuBtn"></div>
			<div id="rightMenuOption" class="rightMenuBtn"></div>
			<div id="rightMenuSkill" class="rightMenuBtn"></div>
			<div id="rightMenuTeam" class="rightMenuBtn"></div>
			<div id="rightMenuClub" class="rightMenuBtn"></div>
			<div id="rightMenuQuest" class="rightMenuBtn"></div>
		</div>
			<div id="rightMenuOpen" class="rightMenuOpenBtn"></div>
	</div>

	<!--ステータス-->
	<div id="leftStatus">
		<div id="leftStatusPanel">
			<div id="leftOpen"></div>
			<div id="leftCoolTimer"></div>
			<div id="leftXpBar"></div>
			<div id="leftPower"></div>
			<div id="leftEnvironment"></div>
			<div id="leftComboCount"></div>
			<div id="leftAfkBtn"></div>
			<div id="leftFootBtn"></div>
			<div id="leftStatusBtn"></div>
			<div id="leftEnvironmentBtn"></div>
			<div id="leftNoExpandBtn"></div>
			<div id="leftSkillSlot"></div>
		</div>

		<div id="leftStatusList">
			<div class="leftStatusView"><div class="en">H P</div><div class="leftStatusText" id="leftHP">190/190</div></div>
			<div class="leftStatusView"><div class="en">M P</div><div class="leftStatusText" id="leftMP">50/50</div></div>
			<div class="leftStatusView"><div class="en">S P</div><div class="leftStatusText" id="leftSP">950/950</div></div>
			<div class="leftStatusView"><div class="en">X P</div><div class="leftStatusText" id="leftXP">0</div></div>
			<br>
			<div class="leftStatusView"><div class="en">WEiGHT</div><div class="leftStatusText" id="leftWEIGHT">27/1050</div></div>
			<div class="leftStatusView"><div class="en">FAME</div><div class="leftStatusText" id="leftFAME">100</div></div>
			<div class="leftStatusView"><div class="en">SPEED</div><div class="leftStatusText" id="leftSPEED">50</div></div>
		</div>
	</div>


	<!-- 最後に書く -->
	<script type="module" src="./game.js"></script>

</body>

</html>
