<!DOCTYPE html>
<html lang="ja">

<head>
	<meta charset="UTF-8">
	<!-- ユーザーによる拡大縮小操作自体を禁止する(Safari非対応) -->
	<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
	<!--<link rel="icon" href="data:,">-->
	<link rel="icon" href="/assets/icon.ico" sizes="any">
	<title>TalesBeaver</title>
	<link rel="stylesheet" href="./css/game.css">
	<link rel="stylesheet" href="./css/resize.css">
	<link rel="stylesheet" href="./css/chat.css">
	<link rel="stylesheet" href="./css/rightMenu.css">
	<link rel="stylesheet" href="./css/leftStatus.css">
	
	<script>
		//(いまいち) スクリプトが読み込まれた瞬間、できるだけ早く実行する
		//if ("scrollRestoration" in history) 
		//	history.scrollRestoration = "manual";// ブラウザによる自動スクロール位置の復元を無効にする
	</script>
</head>

<body>

	<!--2Dキャンバス　DOMをcanvasに入れるとDOMは消える-->
	<canvas id="gameCanvas"></canvas>

	<!--デバッグ用-->
	<div id="debugInfo"></div>

	<!-- ロード画面 -->
	<div id="loading-screen">
		<div class="loading-content">
			<p id="loading-text">Loading... 0%</p>
			<div class="progress-bar-bg">
				<div id="progress-bar"></div>
			</div>
		</div>
	</div>

	<!-- チャットウィンドウ -->
	<div id="chatArea">

		<div id="chatTopBar"></div>

		<!-- チャット範囲選択 -->
		<div id="chatRange">
			<div id="chatRangeClub" class="chatRangeBtn"></div>
			<div id="chatRangeWhisper" class="chatRangeBtn"></div>
			<div id="chatRangeParty" class="chatRangeBtn"></div>
			<div id="chatRangeOpen" class="chatRangeBtn"></div>
		</div>

		<!-- ログエリア -->
		<div id="chatLogArea">
			<div id="chatLog"></div>
			<div id="chatScrollArea">
				<div id="chatScrollUp"></div>
				<div id="chatScrollTrack">
					<div id="chatScrollBar"></div>
				</div>
				<div id="chatScrollDown"></div>
			</div>
		</div>
			
		<!-- インプットエリア -->
		<div id="chatUnder">
			<div id="chatOpen" class="chatBtn"></div>
			<input type="test" id="chatWhisperUser">
			<input type="text" id="chatInput" placeholder="">
			<div id="chatMail" class="chatBtn"></div>
			<div id="chatMemo" class="chatBtn"></div>
			<div id="chatMessanger" class="chatBtn"></div>
			<div id="chatDM" class="chatBtn"></div>
			<div id="chatFixedText" class="chatBtn"></div>
			<div id="chatEmote" class="chatBtn"></div>
		</div>
	</div>

	<!-- 右メニュー -->
	<div id="rightMenu">
		<div id="rightMenuButtons" class="closed">
			<div id="rightMenuCharacter" class="rightMenuBtn"></div>
			<div id="rightMenuCombo" class="rightMenuBtn"></div>
			<div id="rightMenuEquip" class="rightMenuBtn"></div>
			<div id="rightMenuItem" class="rightMenuBtn"></div>
			<div id="rightMenuOption" class="rightMenuBtn"></div>
			<div id="rightMenuSkill" class="rightMenuBtn"></div>
			<div id="rightMenuTeam" class="rightMenuBtn"></div>
			<div id="rightMenuClub" class="rightMenuBtn"></div>
			<div id="rightMenuQuest" class="rightMenuBtn"></div>
		</div>
			<div id="rightMenuOpen" class="rightMenuOpenBtn"></div>
	</div>

	<!--ステータス-->
	<div id="leftStatus">
		<div id="leftStatusPanel">
			<div id="leftOpen"></div>
			<div id="leftCoolTimer"></div>
			<div id="leftXpBar"></div>
			<div id="leftPower"></div>
			<div id="leftComboCount"></div>
			<div class="leftStatusBtn" id="leftEnvironment"></div>
			<div class="leftStatusBtn" id="leftAfkBtn"></div>
			<div class="leftStatusBtn" id="leftFootBtn"></div>
			<div class="leftStatusBtn" id="leftStatusBtn"></div>
			<div class="leftStatusBtn" id="leftEnvironmentBtn"></div>
			<div class="leftStatusBtn" id="leftNoExpandBtn"></div>
			<div id="leftSkillSlot"></div>
		</div>

		<div id="leftStatusList">
			<div id="leftStatusTitleCol">
				<div class="leftStatusTitle"><span>H P</span></div>
				<div class="leftStatusTitle"><span>M P</span></div>
				<div class="leftStatusTitle"><span>S P</span></div>
				<div class="leftStatusTitle"><span>X P</span></div>
				<div class="leftStatusTitle"></div>
				<div class="leftStatusTitle"><span>WEiGHT</span></div>
				<div class="leftStatusTitle"><span>FAME</span></div>
				<div class="leftStatusTitle"><span>SPEED</span></div>
			</div>

			<div id="leftStatusValueCol">
				<div class="leftStatusText" id="leftHP"><span>190/190</span></div>
				<div class="leftStatusText" id="leftMP"><span>50/50</span></div>
				<div class="leftStatusText" id="leftSP"><span>950/950</span></div>
				<div class="leftStatusText" id="leftXP"><span>0</span></div>
				<div class="leftStatusText" ></div>
				<div class="leftStatusText" id="leftWEIGHT"><span>27/1050</span></div>
				<div class="leftStatusText" id="leftFAME"><span>100</span></div>
				<div class="leftStatusText" id="leftSPEED"><span>50</span></div>
			</div>
		</div>
	</div>


	<!-- 最後に書く -->
	<script type="module" src="./game.js"></script>

</body>

</html>
